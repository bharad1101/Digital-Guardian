{% extends "base.html" %}

{% block title %}
Register | Digital Guardian
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">🛡</div>

        <h2>Create Guardian Account</h2>

        <p class="muted">
            Start building your personal cybersecurity protection profile.
        </p>

        <form method="POST">

            <label>Full Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >

            <label>Email Address</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Create password"
                minlength="6"
                required
            >

            <label>Confirm Password</label>

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm password"
                minlength="6"
                required
            >

            <button
                type="submit"
                class="primary-button full"
            >
                Create Account
            </button>

        </form>

        <p class="auth-bottom">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>

    </div>

</div>

{% endblock %}
