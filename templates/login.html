{% extends "base.html" %}
{% block title %}Login | Digital Guardian{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="card auth-card">
        <div class="auth-icon" aria-hidden="true">🔐</div>
        <h1>Welcome back</h1>
        <p class="muted">Access your cybersecurity command center.</p>

        <form method="POST" action="{{ url_for('auth.login_page') }}" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="field">
                <label for="email">Email address</label>
                <input id="email" type="email" name="email" autocomplete="email"
                       placeholder="you@example.com" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input id="password" type="password" name="password"
                       autocomplete="current-password" placeholder="Your password" required>
            </div>

            <div class="checkbox-row">
                <input id="remember" type="checkbox" name="remember" value="1">
                <label for="remember">Keep me signed in on this device</label>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>

        <p class="auth-foot">Don't have an account? <a href="{{ url_for('auth.register_page') }}">Register</a></p>
    </div>
</div>
{% endblock %}
