{% extends "base.html" %}
{% block title %}Create account | Digital Guardian{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="card auth-card">
        <div class="auth-icon" aria-hidden="true">🛡️</div>
        <h1>Create your account</h1>
        <p class="muted">Start building your personal cybersecurity protection profile.</p>

        <form method="POST" action="{{ url_for('auth.register_page') }}" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="field">
                <label for="name">Full name</label>
                <input id="name" type="text" name="name" autocomplete="name"
                       maxlength="100" placeholder="Your name" required>
            </div>

            <div class="field">
                <label for="email">Email address</label>
                <input id="email" type="email" name="email" autocomplete="email"
                       placeholder="you@example.com" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input id="password" type="password" name="password"
                       autocomplete="new-password" minlength="8" required>
                <p class="form-hint">At least 8 characters. Use a unique password.</p>
            </div>

            <div class="field">
                <label for="confirm_password">Confirm password</label>
                <input id="confirm_password" type="password" name="confirm_password"
                       autocomplete="new-password" minlength="8" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">Create account</button>
        </form>

        <p class="auth-foot">Already have an account? <a href="{{ url_for('auth.login_page') }}">Login</a></p>
    </div>
</div>
{% endblock %}
