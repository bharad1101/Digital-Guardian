{% extends "base.html" %}

{% block title %}
Login | Digital Guardian
{% endblock %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-icon">🔐</div>

        <h2>Guardian Login</h2>

        <p class="muted">
            Access your cybersecurity command center.
        </p>

        <form method="POST">

            <label>Email Address</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button
                type="submit"
                class="primary-button full"
            >
                Login
            </button>

        </form>

        <p class="auth-bottom">
            Don't have an account?
            <a href="{{ url_for('register') }}">Register</a>
        </p>

    </div>

</div>

{% endblock %}
